# Builds CV.pdf from CV.tex on any machine (Windows/macOS/Linux).
#
#   conda env create -f environment.yml
#   conda run -n talk-slides tectonic CV.tex        (run inside CV/)
#
# Reuses the talk-slides env: this file mirrors talk_slides/environment.yml, so either
# file creates the same env. The CV only needs tectonic; ghostscript and perl are for
# the talk slides. Tectonic downloads the LaTeX packages it needs on first run; pinning
# its version also pins that package bundle, so the PDF comes out the same everywhere.
name: talk-slides
channels:
  - conda-forge
dependencies:
  - tectonic=0.17.*
  - ghostscript=10.*
  - perl
